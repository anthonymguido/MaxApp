name: Build iPhone app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project FloorPlanScanner.xcodeproj -target FloorPlanScanner \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/FloorPlanScanner.app Payload/
          zip -qry FloorPlanScanner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FloorPlanScanner-ipa
          path: FloorPlanScanner.ipa

      - name: Unit tests (reconstruction math)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Simulator: $UDID"
          xcodebuild test -project FloorPlanScanner.xcodeproj -scheme ReconTests -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO | tail -40
          exit ${PIPESTATUS[0]}

# Generated into an Xcode project by XcodeGen (the GitHub build does this for you).
name: FloorPlanScanner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  FloorPlanScanner:
    type: application
    platform: iOS
    sources: [FloorPlanScanner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FloorPlanScanner
        INFOPLIST_FILE: FloorPlanScanner/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
  ReconTests:
    # Unit tests for the reconstruction math (no ARKit), run on the iOS Simulator in CI.
    type: bundle.unit-test
    platform: iOS
    sources: [FloorPlanScanner/Recon, Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ReconTests
schemes:
  ReconTests:
    build:
      targets:
        ReconTests: all
    test:
      targets: [ReconTests]
